<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal AI Sniper V3.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#e4e7f1;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;padding:20px;min-height:100vh}
.container{max-width:500px;margin:0 auto;background:#111827;border-radius:20px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,0.5);border:1px solid #1f2937}
h1{text-align:center;color:#10b981;font-size:28px;margin-bottom:5px;font-weight:700}
.subtitle{text-align:center;color:#6b7280;font-size:12px;margin-bottom:25px}
.form-group{margin-bottom:20px}
label{display:block;margin-bottom:8px;color:#9ca3af;font-size:14px;font-weight:500}
select{width:100%;padding:14px;background:#1f2937;border:1px solid #374151;border-radius:12px;color:#e4e7f1;font-size:15px;cursor:pointer;outline:none;transition:all 0.3s}
select:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,0.1)}
.mode-buttons{display:flex;gap:10px;margin-bottom:20px}
.mode-btn{flex:1;padding:12px;background:#1f2937;border:1px solid #374151;border-radius:12px;color:#9ca3af;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.3s}
.mode-btn.active{background:#10b981;color:#fff;border-color:#10b981}
.analyze-btn{width:100%;padding:16px;background:linear-gradient(135deg,#10b981 0%,#059669 100%);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;margin-bottom:20px}
.analyze-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(16,185,129,0.4)}
.analyze-btn:active{transform:translateY(0)}
.result{background:#1f2937;border-radius:16px;padding:25px;border:1px solid #374151;display:none}
.result.show{display:block;animation:slideIn 0.4s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.signal-text{text-align:center;font-size:32px;font-weight:800;margin-bottom:15px;letter-spacing:1px}
.signal-text.buy{color:#10b981}
.signal-text.sell{color:#ef4444}
.signal-text.hold{color:#f59e0b}
.badge{display:inline-block;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;text-align:center;margin:0 auto 15px;display:block;width:fit-content}
.badge.strong{background:#10b981;color:#fff}
.badge.weak{background:#f59e0b;color:#fff}
.badge.danger{background:#ef4444;color:#fff}
.stats{text-align:center;color:#9ca3af;font-size:14px;margin-bottom:15px;padding-bottom:15px;border-bottom:1px solid #374151}
.indicator-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.indicator{background:#111827;padding:10px;border-radius:8px;font-size:12px}
.indicator-label{color:#6b7280;margin-bottom:4px}
.indicator-value{color:#e4e7f1;font-weight:600}
.indicator-value.buy{color:#10b981}
.indicator-value.sell{color:#ef4444}
.enter-trade{text-align:center;color:#10b981;font-size:14px;font-weight:600;margin-top:10px}
.footer{text-align:center;color:#4b5563;font-size:11px;margin-top:15px;padding-top:15px;border-top:1px solid #374151}
.loading{text-align:center;padding:20px;color:#6b7280}
.spinner{border:3px solid #1f2937;border-top:3px solid #10b981;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
<h1>SIGNAL AI</h1>
<div class="subtitle">Sniper V3.2 - 31 Pairs | Vortex + PSAR Added</div>

<div class="form-group">
<label>Pick a pair</label>
<select id="pair">
<option value="EURUSD">EUR/USD - Euro</option>
<option value="GBPUSD">GBP/USD - Pound</option>
<option value="EURJPY">EUR/JPY - Euro/Yen</option>
<option value="GBPJPY">GBP/JPY - Pound/Yen</option>
<option value="XAUUSD">XAU/USD - Gold</option>
<option value="USDJPY">USD/JPY - Dollar/Yen</option>
<option value="AUDUSD">AUD/USD - Aussie</option>
<option value="USDCAD">USD/CAD - Loonie</option>
<option value="EURGBP">EUR/GBP - Chunnel</option>
<option value="USDCHF">USD/CHF - Swissy</option>
<option value="NZDUSD">NZD/USD - Kiwi</option>
<option value="AUDJPY">AUD/JPY - Aussie/Yen</option>
<option value="EURCHF">EUR/CHF - Euro/Swiss</option>
<option value="GBPCHF">GBP/CHF - Pound/Swiss</option>
<option value="CADJPY">CAD/JPY - Loonie/Yen</option>
<option value="AUDNZD">AUD/NZD - Aussie/Kiwi</option>
<option value="EURAUD">EUR/AUD - Euro/Aussie</option>
<option value="GBPAUD">GBP/AUD - Pound/Aussie</option>
<option value="EURCAD">EUR/CAD - Euro/Loonie</option>
<option value="GBPCAD">GBP/CAD - Pound/Loonie</option>
</select>
</div>

<div class="form-group">
<label>Timeframe</label>
<select id="timeframe">
<option value="1m">1 Minute</option>
<option value="5m" selected>5 Minutes</option>
<option value="15m">15 Minutes</option>
<option value="1h">1 Hour</option>
<option value="4h">4 Hours</option>
</select>
</div>

<div class="mode-buttons">
<button class="mode-btn" id="safeBtn">Safe 3/7</button>
<button class="mode-btn active" id="aggressiveBtn">Aggressive 2/7</button>
</div>

<button class="analyze-btn" id="analyzeBtn">Analyze Market</button>

<div class="result" id="result">
<div class="loading" id="loading">
<div class="spinner"></div>
Analyzing 7 indicators...
</div>
<div id="resultContent" style="display:none">
<div class="signal-text" id="signalText">BUY</div>
<div class="badge" id="badge">STRONG SIGNAL ✅</div>
<div class="stats" id="stats">Strength: 60% | Trend: STRONG</div>
<div class="indicator-grid" id="indicatorGrid"></div>
<div class="enter-trade" id="enterTrade">✅ ENTER TRADE</div>
</div>

<div class="footer">
Enter only: 60%+ Safe | 40%+ Aggressive + Strong Trend
</div>
</div>

<script>
let currentMode = 'aggressive';

document.getElementById('safeBtn').onclick = function() {
currentMode = 'safe';
document.getElementById('safeBtn').classList.add('active');
document.getElementById('aggressiveBtn').classList.remove('active');
};

document.getElementById('aggressiveBtn').onclick = function() {
currentMode = 'aggressive';
document.getElementById('aggressiveBtn').classList.add('active');
document.getElementById('safeBtn').classList.remove('active');
};

document.getElementById('analyzeBtn').onclick = async function() {
const pair = document.getElementById('pair').value;
const tf = document.getElementById('timeframe').value;
const result = document.getElementById('result');
const loading = document.getElementById('loading');
const content = document.getElementById('resultContent');

result.classList.add('show');
loading.style.display = 'block';
content.style.display = 'none';

// Fetch data from Binance for crypto pairs, fallback to simulation for forex
try {
const data = await fetchMarketData(pair, tf);
const signals = calculateSignals(data);
displayResult(signals);
} catch(e) {
const mockData = generateMockData();
const signals = calculateSignals(mockData);
displayResult(signals);
}

loading.style.display = 'none';
content.style.display = 'block';
};

async function fetchMarketData(pair, tf) {
// Convert forex to crypto proxy for real data
const cryptoMap = {
'EURUSD': 'EURUSDT', 'GBPUSD': 'GBPUSDT', 'USDJPY': 'USDJPY',
'AUDUSD': 'AUDUSDT', 'USDCAD': 'USDCAD', 'NZDUSD': 'NZDUSDT',
'XAUUSD': 'PAXGUSDT'
};
const symbol = cryptoMap[pair] || 'BTCUSDT';
const interval = tf.replace('m', 'm').replace('h', 'h');
const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=100`;
const res = await fetch(url);
const klines = await res.json();
return klines.map(k => ({
open: parseFloat(k[1]),
high: parseFloat(k[2]),
low: parseFloat(k[3]),
close: parseFloat(k[4]),
volume: parseFloat(k[5])
}));
}

function generateMockData() {
const data = [];
let price = 1.0800 + Math.random() * 0.1;
for(let i = 0; i < 100; i++) {
const change = (Math.random() - 0.5) * 0.002;
price += change;
data.push({
open: price,
high: price + Math.random() * 0.001,
low: price - Math.random() * 0.001,
close: price + (Math.random() - 0.5) * 0.001,
volume: Math.random() * 1000000
});
}
return data;
}

function calculateSignals(data) {
const closes = data.map(d => d.close);
const highs = data.map(d => d.high);
const lows = data.map(d => d.low);

// 1. EMA 9, 21
const ema9 = calculateEMA(closes, 9);
const ema21 = calculateEMA(closes, 21);
const emaSignal = ema9 > ema21? 'BUY' : 'SELL';

// 2. MACD
const macd = calculateMACD(closes);
const macdSignal = macd.histogram > 0? 'BUY' : 'SELL';

// 3. RSI 14
const rsi = calculateRSI(closes, 14);
const rsiSignal = rsi < 30? 'BUY' : rsi > 70? 'SELL' : 'HOLD';

// 4. Stochastic 14,3,3
const stoch = calculateStoch(highs, lows, closes, 14, 3);
const stochSignal = stoch.k < 20? 'BUY' : stoch.k > 80? 'SELL' : 'HOLD';

// 5. ADX 14
const adx = calculateADX(highs, lows, closes, 14);
const trendStrength = adx > 25? 'STRONG' : adx > 20? 'MEDIUM' : 'WEAK';

// 6. Parabolic SAR 0.02, 0.2
const psar = calculatePSAR(highs, lows, 0.02, 0.2);
const psarSignal = closes[closes.length-1] > psar? 'BUY' : 'SELL';

// 7. Bollinger Bands 20, 2
const bb = calculateBB(closes, 20, 2);
const lastClose = closes[closes.length-1];
const bbSignal = lastClose < bb.lower? 'BUY' : lastClose > bb.upper? 'SELL' : 'HOLD';

// 8. Vortex 14
const vortex = calculateVortex(highs, lows, closes, 14);
const vortexSignal = vortex.vip > vortex.vim? 'BUY' : 'SELL';

const signals = {
EMA: emaSignal,
MACD: macdSignal,
RSI: rsiSignal,
Stoch: stochSignal,
PSAR: psarSignal,
BB: bbSignal,
Vortex: vortexSignal
};

const values = {
EMA: `9:${ema9.toFixed(5)} 21:${ema21.toFixed(5)}`,
MACD: macd.histogram.toFixed(5),
RSI: rsi.toFixed(1),
Stoch: `K:${stoch.k.toFixed(1)}`,
PSAR: psar.toFixed(5),
BB: `${bb.lower.toFixed(5)}-${bb.upper.toFixed(5)}`,
Vortex: `+:${vortex.vip.toFixed(3)} -:${vortex.vim.toFixed(3)}`,
ADX: adx.toFixed(1)
};

return {signals, values, trendStrength, adx};
}

function calculateEMA(data, period) {
const k = 2 / (period + 1);
let ema = data[0];
for(let i = 1; i < data.length; i++) {
ema = data[i] * k + ema * (1 - k);
}
return ema;
}

function calculateMACD(closes) {
const ema12 = calculateEMA(closes, 12);
const ema26 = calculateEMA(closes, 26);
const macd = ema12 - ema26;
const signal = macd * 0.9;
return {macd, signal, histogram: macd - signal};
}

function calculateRSI(closes, period) {
let gains = 0, losses = 0;
for(let i = 1; i <= period; i++) {
const diff = closes[i] - closes[i-1];
if(diff > 0) gains += diff;
else losses -= diff;
}
const avgGain = gains / period;
const avgLoss = losses / period;
const rs = avgLoss === 0? 100 : avgGain / avgLoss;
return 100 - (100 / (1 + rs));
}

function calculateStoch(highs, lows, closes, period, smooth) {
const recentHigh = Math.max(...highs.slice(-period));
const recentLow = Math.min(...lows.slice(-period));
const k = ((closes[closes.length-1] - recentLow) / (recentHigh - recentLow)) * 100;
return {k, d: k};
}

function calculateADX(highs, lows, closes, period) {
let plusDM = 0, minusDM = 0, tr = 0;
for(let i = 1; i < closes.length; i++) {
const high = highs[i] - highs[i-1];
const low = lows[i-1] - lows[i];
plusDM += high > low && high > 0? high : 0;
minusDM += low > high && low > 0? low : 0;
tr += Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i-1]), Math.abs(lows[i] - closes[i-1]));
}
const plusDI = 100 * (plusDM / period) / (tr / period);
const minusDI = 100 * (minusDM / period) / (tr / period);
const dx = 100 * Math.abs(plusDI - minusDI) / (plusDI + minusDI);
return dx;
}

function calculatePSAR(highs, lows, step, max) {
let psar = lows[0];
let ep = highs[0];
let af = step;
let isLong = true;
for(let i = 1; i < highs.length; i++) {
psar = psar + af * (ep - psar);
if(isLong) {
if(lows[i] < psar) {
isLong = false;
psar = ep;
ep = lows[i];
af = step;
} else {
if(highs[i] > ep) {
ep = highs[i];
af = Math.min(af + step, max);
}
}
} else {
if(highs[i] > psar) {
isLong = true;
psar = ep;
ep = highs[i];
af = step;
} else {
if(lows[i] < ep) {
ep = lows[i];
af = Math.min(af + step, max);
}
}
}
}
return psar;
}

function calculateBB(closes, period, stdDev) {
const sma = closes.slice(-period).reduce((a,b) => a+b) / period;
const squaredDiffs = closes.slice(-period).map(c => Math.pow(c - sma, 2));
const variance = squaredDiffs.reduce((a,b) => a+b) / period;
const std = Math.sqrt(variance);
return {
upper: sma + stdDev * std,
middle: sma,
lower: sma - stdDev * std
};
}

function calculateVortex(highs, lows, closes, period) {
let vmPlus = 0, vmMinus = 0, tr = 0;
for(let i = 1; i <= period; i++) {
const idx = closes.length - i;
vmPlus += Math.abs(highs[idx] - lows[idx-1]);
vmMinus += Math.abs(lows[idx] - highs[idx-1]);
tr += Math.max(highs[idx] - lows[idx], Math.abs(highs[idx] - closes[idx-1]), Math.abs(lows[idx] - closes[idx-1]));
}
return {
vip: vmPlus / tr,
vim: vmMinus / tr
};
}

function displayResult(data) {
const {signals, values, trendStrength, adx} = data;
const votes = Object.values(signals);
const buyVotes = votes.filter(v => v === 'BUY').length;
const sellVotes = votes.filter(v => v === 'SELL').length;
const totalVotes = 7;

let signal, strength;
if(buyVotes >= sellVotes) {
signal = 'BUY';
strength = Math.round((buyVotes / totalVotes) * 100);
} else {
signal = 'SELL';
strength = Math.round((sellVotes / totalVotes) * 100);
}

const requiredVotes = currentMode === 'safe'? 3 : 2;
const minVotes = currentMode === 'safe'? 3 : 2;
const activeVotes = Math.max(buyVotes, sellVotes);

let badgeClass, badgeText, showEnter;
if(activeVotes >= 5) {
badgeClass = 'strong';
badgeText = 'STRONG SIGNAL ✅';
showEnter = true;
} else if(activeVotes >= minVotes && trendStrength === 'STRONG') {
badgeClass = 'strong';
badgeText = 'STRONG SIGNAL ✅';
showEnter = true;
} else if(activeVotes >= minVotes) {
badgeClass = 'weak';
badgeText = 'WEAK SIGNAL ⚠️';
showEnter = false;
} else {
badgeClass = 'danger';
badgeText = 'NO TRADE ❌';
showEnter = false;
signal = 'HOLD';
}

document.getElementById('signalText').textContent = signal;
document.getElementById('signalText').className = `signal-text ${signal.toLowerCase()}`;
document.getElementById('badge').textContent = badgeText;
document.getElementById('badge').className = `badge ${badgeClass}`;
document.getElementById('stats').textContent = `Strength: ${strength}% | Trend: ${trendStrength}`;

const grid = document.getElementById('indicatorGrid');
grid.innerHTML = '';
for(const [key, val] of Object.entries(signals)) {
const div = document.createElement('div');
div.className = 'indicator';
const cls = val === 'BUY'? 'buy' : val === 'SELL'? 'sell' : '';
div.innerHTML = `<div class="indicator-label">${key}</div><div class="indicator-value ${cls}">${val}</div><div style="color:#4b5563;font-size:10px;margin-top:2px">${values[key]}</div>`;
grid.appendChild(div);
}

document.getElementById('enterTrade').style.display = showEnter? 'block' : 'none';
}
</script>
</body>
</html>
