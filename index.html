<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal AI - Sniper V3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
    .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            background: linear-gradient(90deg, #00ff88, #00aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    .subtitle {
            text-align: center;
            opacity: 0.6;
            font-size: 12px;
            margin-bottom: 25px;
        }
    .card { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            opacity: 0.8;
        }
        select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        select option { background: #1a1a2e; color: #fff; }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00ff88, #00aaff);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.98); }
        #result {
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            text-align: center;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    .warning {
            font-size: 11px;
            opacity: 0.5;
            text-align: center;
            margin-top: 15px;
        }
    .signal-mode {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
    .signal-mode button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    .signal-mode button.active {
            background: linear-gradient(90deg, #00ff88, #00aaff);
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SIGNAL AI</h1>
        <div class="subtitle">Sniper V3 - 27 Pairs | Aggressive Mode</div>

        <div class="card">
            <label>Pick a pair</label>
            <select id="pair">
                <option value="EUR/USD">EUR/USD - Euro</option>
                <option value="GBP/USD">GBP/USD - Pound</option>
                <option value="USD/JPY">USD/JPY - Yen</option>
                <option value="USD/CAD">USD/CAD - Loonie</option>
                <option value="AUD/USD">AUD/USD - Aussie</option>
                <option value="EUR/JPY">EUR/JPY</option>
                <option value="GBP/JPY">GBP/JPY</option>
                <option value="USD/CHF">USD/CHF - Swissy</option>
                <option value="EUR/GBP">EUR/GBP</option>
                <option value="EUR/CHF">EUR/CHF</option>
                <option value="GBP/CHF">GBP/CHF</option>
                <option value="AUD/JPY">AUD/JPY</option>
                <option value="AUD/CHF">AUD/CHF</option>
                <option value="AUD/CAD">AUD/CAD</option>
                <option value="CAD/JPY">CAD/JPY</option>
                <option value="CHF/JPY">CHF/JPY</option>
                <option value="CAD/CHF">CAD/CHF</option>
                <option value="GBP/CAD">GBP/CAD</option>
                <option value="GBP/AUD">GBP/AUD</option>
                <option value="EUR/AUD">EUR/AUD</option>
                <option value="NZD/USD">NZD/USD - Kiwi</option>
                <option value="XAU/USD" selected>XAU/USD - GOLD 🔥</option>
                <option value="BTC/USD">BTC/USD - BITCOIN 🚀</option>
                <option value="ETH/USD">ETH/USD - ETHEREUM 💎</option>
                <option value="NAS100">NAS100 - Nasdaq</option>
                <option value="SPX">SPX - S&P 500</option>
                <option value="USOIL">USOIL - Oil</option>
            </select>
        </div>

        <div class="card">
            <label>Timeframe</label>
            <select id="timeframe">
                <option value="1min">1 Minute</option>
                <option value="2min">2 Minutes</option>
                <option value="3min">3 Minutes</option>
                <option value="5min" selected>5 Minutes</option>
                <option value="10min">10 Minutes</option>
                <option value="15min">15 Minutes</option>
                <option value="30min">30 Minutes</option>
                <option value="1h">1 Hour</option>
                <option value="4h">4 Hours</option>
                <option value="1day">1 Day</option>
                <option value="1week">1 Week</option>
            </select>
        </div>

        <div class="signal-mode">
            <button id="safeBtn" onclick="setMode('safe')">Safe 3/5</button>
            <button id="aggressiveBtn" class="active" onclick="setMode('aggressive')">Aggressive 2/5</button>
        </div>

        <button onclick="analyzeMarket()">Analyze Market</button>

        <div id="result">Select pair & timeframe, then press Analyze</div>

        <div class="warning">Safe: 3/5 indicators | Aggressive: 2/5 indicators</div>
    </div>

    <script>
        // REPLACE THIS WITH YOUR TWELVEDATA API KEY
        const API_KEY = 'ca4df2aa10dc40989e18550a74c7b24e';
        let signalMode = 'aggressive'; // Default to aggressive for more signals

        function setMode(mode) {
            signalMode = mode;
            document.getElementById('safeBtn').classList.remove('active');
            document.getElementById('aggressiveBtn').classList.remove('active');
            document.getElementById(mode + 'Btn').classList.add('active');
        }

        function calculateEMA(data, period) {
            const k = 2 / (period + 1);
            let ema = [data[0]];
            for(let i = 1; i < data.length; i++) {
                ema.push(data[i] * k + ema[i-1] * (1 - k));
            }
            return ema;
        }

        function calculateRSI(data, period) {
            let gains = [], losses = [];
            for(let i = 1; i < data.length; i++) {
                const diff = data[i] - data[i-1];
                gains.push(diff > 0? diff : 0);
                losses.push(diff < 0? -diff : 0);
            }
            let avgGain = gains.slice(0, period).reduce((a,b) => a+b, 0) / period;
            let avgLoss = losses.slice(0, period).reduce((a,b) => a+b, 0) / period;
            let rsi = [100 - (100 / (1 + avgGain/(avgLoss || 0.0001)))];

            for(let i = period; i < gains.length; i++) {
                avgGain = (avgGain * (period-1) + gains[i]) / period;
                avgLoss = (avgLoss * (period-1) + losses[i]) / period;
                avgLoss = avgLoss === 0? 0.0001 : avgLoss;
                rsi.push(100 - (100 / (1 + avgGain/avgLoss)));
            }
            return rsi;
        }

        function calculateMACD(data) {
            const ema12 = calculateEMA(data, 12);
            const ema26 = calculateEMA(data, 26);
            const macdLine = ema12.map((v, i) => v - ema26[i]);
            const signalLine = calculateEMA(macdLine.slice(26), 9);
            const histogram = macdLine.slice(26 + 9 - 1).map((v, i) => v - signalLine[i]);
            return { histogram: histogram };
        }

        function calculateBB(data, period) {
            let upper = [], lower = [], middle = [];
            for(let i = period-1; i < data.length; i++) {
                const slice = data.slice(i-period+1, i+1);
                const sma = slice.reduce((a,b) => a+b) / period;
                const std = Math.sqrt(slice.map(x => Math.pow(x - sma, 2)).reduce((a,b) => a+b) / period);
                middle.push(sma);
                upper.push(sma + (std * 2));
                lower.push(sma - (std * 2));
            }
            return { upper: upper, lower: lower, middle: middle };
        }

        function calculateStochastic(highs, lows, closes, period) {
            let k = [];
            for(let i = period-1; i < closes.length; i++) {
                const highMax = Math.max(...highs.slice(i-period+1, i+1));
                const lowMin = Math.min(...lows.slice(i-period+1, i+1));
                k.push(((closes[i] - lowMin) / (highMax - lowMin)) * 100);
            }
            return {k: k};
        }

        function calculateADX(highs, lows, closes, period) {
            let plusDM = [], minusDM = [], tr = [];
            for(let i = 1; i < highs.length; i++) {
                const upMove = highs[i] - highs[i-1];
                const downMove = lows[i-1] - lows[i];
                plusDM.push(upMove > downMove && upMove > 0? upMove : 0);
                minusDM.push(downMove > upMove && downMove > 0? downMove : 0);

                const tr1 = highs[i] - lows[i];
                const tr2 = Math.abs(highs[i] - closes[i-1]);
                const tr3 = Math.abs(lows[i] - closes[i-1]);
                tr.push(Math.max(tr1, tr2, tr3));
            }

            const avgPlusDM = plusDM.slice(-period).reduce((a,b) => a+b) / period;
            const avgMinusDM = minusDM.slice(-period).reduce((a,b) => a+b) / period;
            const avgTR = tr.slice(-period).reduce((a,b) => a+b) / period;

            const plusDI = 100 * (avgPlusDM / avgTR);
            const minusDI = 100 * (avgMinusDM / avgTR);
            const dx = 100 * Math.abs(plusDI - minusDI) / (plusDI + minusDI);

            return dx;
        }

        async function analyzeMarket() {
            const pair = document.getElementById('pair').value;
            const timeframe = document.getElementById('timeframe').value;
            const result = document.getElementById('result');

            result.innerHTML = "Scanning...";

            try {
                const url = `https://api.twelvedata.com/time_series?symbol=${pair}&interval=${timeframe}&outputsize=100&apikey=${API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();

                if(data.status === "error") {
                    result.innerHTML = `<div style="color:#ff4444;">ERROR: ${data.message}</div>`;
                    return;
                }

                if(!data.values || data.values.length < 50) {
                    result.innerHTML = `<div style="color:#ffaa00;">Not enough data for ${pair}</div>`;
                    return;
                }

                const closes = data.values.map(v => parseFloat(v.close)).reverse();
                const highs = data.values.map(v => parseFloat(v.high)).reverse();
                const lows = data.values.map(v => parseFloat(v.low)).reverse();

                // 1. EMA Cross
                const ema9 = calculateEMA(closes, 9);
                const ema21 = calculateEMA(closes, 21);
                const emaSignal = ema9[ema9.length-1] > ema21[ema21.length-1]? 'BUY' : 'SELL';

                // 2. RSI - Loosened to 35/65
                const rsi = calculateRSI(closes, 14);
                const lastRSI = rsi[rsi.length-1];
                const rsiSignal = lastRSI < 35? 'BUY' : lastRSI > 65? 'SELL' : 'HOLD';

                // 3. MACD
                const macd = calculateMACD(closes);
                const macdSignal = macd.histogram[macd.histogram.length-1] > 0? 'BUY' : 'SELL';

                // 4. Bollinger Bands
                const bb = calculateBB(closes, 20);
                const price = closes[closes.length-1];
                const bbSignal = price < bb.lower[bb.lower.length-1]? 'BUY' : price > bb.upper[bb.upper.length-1]? 'SELL' : 'HOLD';

                // 5. Stochastic - Loosened to 25/75
                const stoch = calculateStochastic(highs, lows, closes, 14);
                const lastStoch = stoch.k[stoch.k.length-1];
                const stochSignal = lastStoch < 25? 'BUY' : lastStoch > 75? 'SELL' : 'HOLD';

                // 6. ADX - Trend Strength
                const adx = calculateADX(highs, lows, closes, 14);
                const trendStrength = adx > 25? 'STRONG' : adx > 20? 'MEDIUM' : 'WEAK';

                // Count votes
                const signals = [emaSignal, rsiSignal, macdSignal, bbSignal, stochSignal];
                const buyVotes = signals.filter(s => s === 'BUY').length;
                const sellVotes = signals.filter(s => s === 'SELL').length;

                const requiredVotes = signalMode === 'aggressive'? 2 : 3;

                let finalSignal = 'HOLD';
                let strength = 0;
                let color = '#ffaa00';

                if(buyVotes >= requiredVotes) {
                    finalSignal = 'BUY';
                    strength = Math.round((buyVotes/5)*100);
                    color = '#00ff88';
                } else if(sellVotes >= requiredVotes) {
                    finalSignal = 'SELL';
                    strength = Math.round((sellVotes/5)*100);
                    color = '#ff4444';
                }

                result.innerHTML = `
                    <div style="color:${color}; font-size:32px; font-weight:bold; margin-bottom:8px;">${finalSignal}</div>
                    <div style="font-size:16px; margin-bottom:10px;">Strength: ${strength}% | Trend: ${trendStrength}</div>
                    <div style="font-size:10px; opacity:0.8; line-height:1.5;">
                        EMA: ${emaSignal} | RSI: ${lastRSI.toFixed(0)} ${rsiSignal} | MACD: ${macdSignal}<br>
                        BB: ${bbSignal} | Stoch: ${lastStoch.toFixed(0)} ${stochSignal} | ADX: ${adx.toFixed(0)}
                    </div>
                    <div style="font-size:9px; opacity:0.5; margin-top:8px;">
                        Mode: ${signalMode === 'aggressive'? 'Aggressive 2/5' : 'Safe 3/5'} | ${buyVotes}B ${sellVotes}S ${5-buyVotes-sellVotes}H
                    </div>
                `;

            } catch(error) {
                result.innerHTML = `<div style="color:#ff4444;">ERROR: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
